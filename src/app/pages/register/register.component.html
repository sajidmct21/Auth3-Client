<div class="lg:w-4/12 mt-2 p-4 shadow-lg mx-auto">
 <h3 class="text-3xl text-center font-semibold">Register</h3>

 <form [formGroup]="registerForm" class="flex flex-col">
  <div class="flex flex-col mt-2 mb-1">
    <input formControlName="firstName" class="p-2 border border-gray-300 rounded" type="text" placeholder="First Name">
    <span *ngIf="registerForm.hasError('required','firstName') && registerForm.controls['firstName'].dirty" class="text-red-500">First Name is required </span>
  </div>
  <div class="flex flex-col mt-2 mb-1">
    <input formControlName="lastName" class="p-2 border border-gray-300 rounded" type="text" placeholder="Last Name">
    <span *ngIf="registerForm.hasError('required', 'lastName') && registerForm.controls['lastName'].dirty" class="text-red-500">Last Name is required </span>
  </div>
  <div class="flex flex-col mt-2 mb-1">
    <input formControlName="email" class="p-2 border border-gray-300 rounded" type="email" placeholder="Email">
    <span *ngIf="registerForm.hasError('required','email') && registerForm.controls['email'].dirty" class="text-red-500">Email is required </span>
    <span *ngIf="registerForm.hasError('email','email')" class="text-red-500">Email is Invalid </span>
  </div>
  <div class="flex flex-col mt-2 mb-1">
    <input formControlName="username" class="p-2 border border-gray-300 rounded" type="text" placeholder="Username">
    <span *ngIf="registerForm.hasError('required','username') && registerForm.controls['username'].dirty" class="text-red-500">Username is required </span>
  </div>
  <div class="flex flex-col mt-2 mb-1">
    <input formControlName="password" class="p-2 border border-gray-300 rounded" type="password" placeholder="Password">
    <span *ngIf="registerForm.hasError('required','password') && registerForm.controls['password'].dirty" class="text-red-500">Password is required </span>
  </div>
  <div class="flex flex-col mt-2 mb-1">
    <input formControlName="confirmPassword" class="p-2 border border-gray-300 rounded" type="password" placeholder="Confirm Password">
    <span *ngIf="registerForm.hasError('required','confirmPassword') && registerForm.controls['confirmPassword'].dirty" class="text-red-500">Confirm Password is required </span>
    <span *ngIf="registerForm.hasError('confirmPasswordValidator','confirmPassword') && registerForm.controls['confirmPassword'].dirty" class="text-red-500">Password did not match</span>
  </div>

  <!-- Dropdown List  -->
  <div class="flex flex-col mt-2 mb-1">
    <select formControlName="userRole" id="role" class="p-2 border border-gray-300 rounded">
      <option value="" disabled>Select a Role</option>
      <option *ngFor="let r of roles" [value]="r.role">{{ r.role }}</option>
    </select>    
  </div>

  <button [disabled]="registerForm.invalid" [class.disabled]="registerForm.invalid" (click)="onRegister()" class="bg-indigo-500 p-2 rounded mt-3 text-white">Submit</button>
 </form>

 <div class="flex justify-center mt-5">
  <span>Already Have Account</span>
  <a class="text-indigo-500 ml-2 cursor-pointer" routerLink="/login">Login Here</a>
 </div>
</div>
